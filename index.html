<meta name="apple-mobile-web-app-title" content="Referto CSEN"><meta name="theme-color" content="#0f1b2d">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: barra app con schede a pillola; in gara un tabellone da palazzetto sopra un campo 18×9 m visto dal tavolo del segnapunti, affiancato dalle console delle due squadre */
:root {
  --bg: #edf1f6; --surface: #ffffff; --surface2: #f3f6fa; --ink: #0f1b2d; --muted: #5a6a80; --line: #dbe2eb;
  --accent: #e2762f; --accentInk: #ffffff;
  --court: #e3833f; --court2: #d2722f; --courtLine: #ffffff; --fz: #1d7a6c; --fz2: #166457; --net: #0f1b2d; --lib: #f4c430;
  --tA: #2459c9; --tB: #c42d5c; --tAsoft: #e3ebfb; --tBsoft: #fbe4ec;
  --ok: #217a42; --warn: #94590a; --bad: #b8322a; --warnBg: #fff3dd; --badBg: #fce8e6; --okBg: #e2f4e8;
  --paper: #ffffff; --paperInk: #111418; --paperLine: #3b4249; --paperSoft: #eef0f2;
  --shadow: 0 1px 2px rgba(15,27,45,.06), 0 6px 18px rgba(15,27,45,.07);
  --fd: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --fb: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a111d; --surface: #121b2b; --surface2: #182336; --ink: #e8eef7; --muted: #92a2b8; --line: #243149;
  --accent: #f08a46; --accentInk: #1a0d04;
  --court: #c9702f; --court2: #b56226; --courtLine: #f4ece4; --fz: #17665a; --fz2: #11524a; --net: #050a12; --lib: #f0c33a;
  --tA: #6f9bff; --tB: #ff6b98; --tAsoft: #18284a; --tBsoft: #3b1828;
  --ok: #6fcf8f; --warn: #f2b45a; --bad: #ff7b70; --warnBg: #36290f; --badBg: #3b1a18; --okBg: #12301f;
  --shadow: 0 0 0 1px #1e2a40, 0 8px 22px rgba(0,0,0,.35);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0a111d; --surface: #121b2b; --surface2: #182336; --ink: #e8eef7; --muted: #92a2b8; --line: #243149;
  --accent: #f08a46; --accentInk: #1a0d04;
  --court: #c9702f; --court2: #b56226; --courtLine: #f4ece4; --fz: #17665a; --fz2: #11524a; --net: #050a12; --lib: #f0c33a;
  --tA: #6f9bff; --tB: #ff6b98; --tAsoft: #18284a; --tBsoft: #3b1828;
  --ok: #6fcf8f; --warn: #f2b45a; --bad: #ff7b70; --warnBg: #36290f; --badBg: #3b1a18; --okBg: #12301f;
  --shadow: 0 0 0 1px #1e2a40, 0 8px 22px rgba(0,0,0,.35);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--fb); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #0f1b2d; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--fd); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; max-width: 1280px; margin: 0 auto; }

/* barra superiore */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: linear-gradient(180deg, #13223a, #0f1b2d); color: #f4f6f8; box-shadow: 0 2px 12px rgba(5,10,20,.25);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 9px; }
.bar-in { display: flex; align-items: center; gap: 10px; max-width: 1280px; margin: 0 auto; }
.bar .ttl { font-family: var(--fd); font-size: 22px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .01em; }
.bar .ttl small { font-family: var(--fd); font-weight: 700; font-size: 15px; margin-left: 10px; background: rgba(255,255,255,.12); padding: 1px 8px; border-radius: 6px; }
.bar button { background: rgba(255,255,255,.1); border: 0; color: #f4f6f8; border-radius: 9px; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
.bar button:hover { background: rgba(255,255,255,.18); }
.mark { width: 32px; height: 32px; flex: none; border-radius: 8px; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
.tabs { display: flex; gap: 4px; max-width: 1280px; margin: 9px auto 1px; overflow-x: auto; background: rgba(255,255,255,.07); border-radius: 12px; padding: 4px; width: fit-content; max-width: 100%; }
.tabs button { background: transparent; border-radius: 9px; padding: 6px 16px; color: #c4cfdc; font-family: var(--fd); font-size: 17px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.tabs button.on { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(226,118,47,.35); }

/* elementi base */
.card { background: var(--surface); border: 0; border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-family: var(--fd); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; color: var(--muted); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; transition: background .15s, border-color .15s; padding: 9px 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 42px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); color: var(--accentInk); border-color: transparent; box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.pri:hover { filter: brightness(1.05); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 34px; padding: 5px 10px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
label.f input, label.f select, label.f textarea, .in { border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 9px 10px; color: var(--ink); font-size: 16px; font-weight: 500; width: 100%; min-width: 0; }
/* campi uniformi su iPad/iPhone: Safari dà a data, ora e menu una larghezza minima e un'altezza proprie */
label.f input, label.f select { display: block; height: 46px; line-height: 1.2; max-width: 100%; -webkit-appearance: none; appearance: none; margin: 0; }
label.f input[type="date"], label.f input[type="time"] { min-width: 0; width: 100%; text-align: left; padding-block: 0; }
label.f input[type="date"]::-webkit-date-and-time-value, label.f input[type="time"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
label.f input::-webkit-calendar-picker-indicator { opacity: .6; }
label.f select { padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size: 5px 5px; background-repeat: no-repeat; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
label.f > * { min-width: 0; }
.fgrid > * { min-width: 0; }
.fgrid > .w2 { grid-column: span 2; }
@media (max-width: 420px) { .fgrid > .w2 { grid-column: auto; } }
textarea { min-height: 80px; resize: vertical; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--ink); }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.msg { border-radius: 8px; padding: 9px 12px; font-size: 14px; }
.msg.warn { background: var(--warnBg); color: var(--warn); }
.msg.bad { background: var(--badBg); color: var(--bad); }
.msg.ok { background: var(--okBg); color: var(--ok); }
.msg.hint { background: color-mix(in srgb, var(--lib) 22%, var(--surface)); color: var(--ink); border-left: 5px solid var(--lib); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.msg.hint .btn { background: var(--lib); color: #2a1d00; border-color: transparent; font-weight: 700; }
.chip.lf.on { box-shadow: inset 0 0 0 2px var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.pill { display: inline-block; border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; background: var(--surface2); border: 1px solid var(--line); }
.pill.live { background: var(--accent); color: var(--accentInk); border-color: transparent; }
.pill.done { background: var(--okBg); color: var(--ok); border-color: transparent; }
.tA { color: var(--tA); } .tB { color: var(--tB); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
.sw.A { background: var(--tA); } .sw.B { background: var(--tB); }
.scroll { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 4px 4px; }
table.t td { padding: 3px 3px; border-top: 1px solid var(--line); vertical-align: middle; }
table.t td input, table.t td select { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 6px 6px; width: 100%; font-size: 15px; color: var(--ink); min-width: 0; }
table.t td input:hover, table.t td select:hover { border-color: var(--line); }
table.t td input:focus { background: var(--surface2); border-color: var(--line); }
td.num input { width: 52px; text-align: center; font-family: var(--fd); font-size: 19px; font-weight: 700; }
td.yr input { width: 108px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
table.t td input.bad { border-color: var(--bad); background: var(--badBg); color: var(--bad); }
td.sx { width: 78px; }
table.t td.nmc input { min-width: 140px; }
table.t td.num { min-width: 54px; }
table.t td.num input { min-width: 48px; }
table.t td.tes input { min-width: 92px; }
table.t td.yr { min-width: 112px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface2); }
.seg button { border: 0; background: transparent; color: var(--muted); font-weight: 700; width: 36px; height: 32px; cursor: pointer; font-size: 15px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on.F { background: var(--tB); color: #fff; }
.seg button.on.M { background: var(--tA); color: #fff; }
table.t th.ck { text-align: center; font-size: 11px; line-height: 1.1; }
table.t th.ck small { font-size: 11px; color: var(--ink); font-weight: 800; }
table.t td select.sel { background: var(--surface2); border: 1px solid var(--line); color: var(--ink); -webkit-appearance: none; appearance: none; padding-right: 26px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
td.role { width: 36%; min-width: 150px; }
select option, select optgroup { background: var(--surface); color: var(--ink); }
td.ck { text-align: center; width: 34px; }
td.ck input { width: 20px; height: 20px; accent-color: var(--accent); }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px 8px; border-radius: 6px; }
.x:hover { color: var(--bad); background: var(--badBg); }

/* home */
.hero { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px; padding: 26px 24px; border-radius: 20px; color: #fff; position: relative; overflow: hidden;
  background: linear-gradient(90deg, transparent calc(50% - 1.5px), rgba(255,255,255,.22) calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
    linear-gradient(90deg, transparent calc(33% - 1px), rgba(255,255,255,.14) calc(33% - 1px) calc(33% + 1px), transparent calc(33% + 1px), transparent calc(67% - 1px), rgba(255,255,255,.14) calc(67% - 1px) calc(67% + 1px), transparent calc(67% + 1px)),
    radial-gradient(120% 140% at 80% 0%, #e98a46, #c9622a 60%, #a84f22); box-shadow: 0 12px 30px rgba(201,98,42,.28); }
.hero > * { position: relative; }
.hero h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.12); }
.hero p { margin: 8px 0 0; color: rgba(255,255,255,.92); max-width: 60ch; }
.hero .btn.pri { background: #fff; color: #a84f22; box-shadow: 0 4px 14px rgba(0,0,0,.18); font-size: 16px; padding: 10px 18px; }
.mlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.mcard { background: var(--surface); border: 0; box-shadow: var(--shadow); border-radius: var(--r); padding: 16px; transition: transform .15s; display: flex; flex-direction: column; gap: 8px; cursor: pointer; text-align: left; }
.mcard:hover { transform: translateY(-2px); }
.mcard .vs { font-family: var(--fd); font-size: 22px; font-weight: 700; line-height: 1.1; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.mcard .vs b { font-variant-numeric: tabular-nums; }

/* gioco: tabellone da palazzetto */
.board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; align-items: stretch; margin-bottom: 14px; background: linear-gradient(180deg, #16263f, #0c1626); border-radius: 18px; padding: 10px; box-shadow: 0 10px 30px rgba(5,12,24,.28); color: #eef3f9; }
.tb { padding: 4px 10px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 14px; min-width: 0; }
.tb.R { grid-template-columns: auto 1fr; }
.tb .nm { font-family: var(--fd); font-size: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; display: flex; align-items: center; gap: 8px; }
.tb .nm::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.tb.R .nm { flex-direction: row-reverse; }
.tb .sc { font-family: var(--fd); font-size: 66px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: #fff; grid-row: span 2; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 92%, #fff), color-mix(in srgb, var(--c) 85%, #000)); border-radius: 12px; min-width: 96px; text-align: center; padding: 4px 10px 2px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), 0 0 24px color-mix(in srgb, var(--c) 45%, transparent); }
.tb .meta { font-size: 13px; color: #a9b8cb; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.tb.R .meta { justify-content: flex-end; }
.ball { display: inline-block; width: 15px; height: 15px; border-radius: 50%; flex: none; background:
  radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 18%, transparent 19%),
  conic-gradient(from 20deg, #fff 0 33%, #f2c230 33% 66%, #2459c9 66% 100%); box-shadow: 0 0 0 1.5px rgba(0,0,0,.25); vertical-align: -2px; }
.mid { color: #f4f6f8; padding: 4px 18px; text-align: center; display: flex; flex-direction: column; justify-content: center; min-width: 116px; border-inline: 1px solid rgba(255,255,255,.1); }
.mid .sn { font-family: var(--fd); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #a9b8cb; }
.mid .sw2 { font-family: var(--fd); font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; color: #ffd27a; }
.dots { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #8ea0b6; display: inline-block; }
.dots i.u { background: #ffd27a; border-color: #ffd27a; }

/* gioco: arena */
.arena { display: grid; grid-template-columns: minmax(150px, 200px) 1fr minmax(150px, 200px); gap: 14px; align-items: stretch; }
.cons { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pt { flex: 1; min-height: 120px; border: 0; border-radius: 18px; color: #fff; font-family: var(--fd); font-size: 32px; font-weight: 800; letter-spacing: .05em; cursor: pointer;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 85%, #fff), var(--c) 45%, color-mix(in srgb, var(--c) 80%, #000));
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.2), 0 8px 20px color-mix(in srgb, var(--c) 30%, transparent); transition: transform .08s; }
.pt:active { transform: translateY(3px) scale(.99); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
.pt small { display: block; font-size: 14px; font-weight: 600; opacity: .9; letter-spacing: .02em; }
.cons .act { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cons .act .btn { justify-content: center; padding: 8px 6px; font-size: 14px; background: var(--surface); box-shadow: var(--shadow); border-color: transparent; }

/* campo da pallavolo 18×9 m con zona libera, linee dei 3 m e rete */
.vcourt { position: relative; background: radial-gradient(120% 140% at 50% 50%, var(--fz), var(--fz2)); border-radius: 18px; padding: 30px clamp(18px, 5%, 46px) 24px; min-width: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), var(--shadow); align-self: center; width: 100%; }
.pitch { position: relative; aspect-ratio: 2 / 1; width: 100%; border: 3px solid var(--courtLine); border-radius: 2px;
  background: linear-gradient(90deg, rgba(255,255,255,.05), transparent 30%, transparent 70%, rgba(255,255,255,.05)), radial-gradient(90% 120% at 50% 40%, color-mix(in srgb, var(--court) 92%, #fff), var(--court) 55%, var(--court2));
  box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.pitch .al { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--courtLine); opacity: .95; }
.pitch .al.l { left: calc(100% / 3); } .pitch .al.r { left: calc(200% / 3); transform: translateX(-3px); }
.pitch .cl { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; transform: translateX(-50%); background: var(--courtLine); }
.pitch .net { position: absolute; left: 50%; top: -22px; bottom: -22px; width: 10px; transform: translateX(-50%); z-index: 2; border-radius: 3px;
  background: linear-gradient(90deg, rgba(255,255,255,.95) 0 2px, transparent 2px calc(100% - 2px), rgba(255,255,255,.95) calc(100% - 2px)), repeating-linear-gradient(0deg, rgba(16,24,40,.9) 0 2px, rgba(16,24,40,.35) 2px 6px); box-shadow: 0 0 0 1px rgba(0,0,0,.25), 3px 0 8px rgba(0,0,0,.25); }
.pitch .net::before, .pitch .net::after { content: ""; position: absolute; left: 50%; width: 14px; height: 14px; border-radius: 50%; background: #d7dde5; border: 3px solid #0f1b2d; transform: translateX(-50%); }
.pitch .net::before { top: -12px; } .pitch .net::after { bottom: -12px; }
.pitch .ant { position: absolute; left: 50%; width: 4px; height: 26px; transform: translateX(-50%); z-index: 3; background: repeating-linear-gradient(180deg, #e8423a 0 5px, #fff 5px 10px); border-radius: 2px; }
.pitch .ant.t { top: -14px; } .pitch .ant.b { bottom: -14px; }
.zones { position: absolute; inset: 0; display: grid; grid-template-columns: 2fr 1fr 1fr 2fr; grid-template-rows: repeat(3, 1fr); }
.zc { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 0; padding: 2px; background: none; border: 0; cursor: pointer; font: inherit; color: #fff; border-radius: 8px; }
.zc:hover .tok, .zc:focus-visible .tok { transform: translateY(-2px) scale(1.04); }
.zc .zl { position: absolute; font-family: var(--fd); font-weight: 800; font-size: clamp(13px, 2vw, 22px); color: rgba(255,255,255,.38); line-height: 1; pointer-events: none; }
.zc.sL .zl { left: 8px; top: 6px; } .zc.sR .zl { right: 8px; top: 6px; }
.tok { --tk: clamp(34px, 6.6vw, 72px); position: relative; width: var(--tk); height: var(--tk); border-radius: 50%; display: grid; place-items: center; font-family: var(--fd); font-weight: 800; font-size: calc(var(--tk) * .5); line-height: 1; color: #fff;

function okDate(v) { v = String(v); if (/^\d{4}$/.test(v)) return true; const m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (!m) return false; const dt = new Date(+m[3], +m[2] - 1, +m[1]); return dt.getDate() === +m[1] && dt.getMonth() === +m[2] - 1 && +m[3] > 1900; }

function isFq(m, p) { const c = m.cfg, y = yr(p); return !!(c.minYear && y && y < c.minYear); }

  const c = m.cfg, T = m.teams[team], e = [];
  const ps = T.players;
  if (ps.length > c.maxRoster) e.push(`Troppi atleti a referto: ${ps.length} su un massimo di ${c.maxRoster}.`);
  const libs = ps.filter(p => p.lib);
  if (!c.libero && libs.length) e.push('In questa categoria il Libero non è previsto.');
  if (libs.length > c.maxLib) e.push(`Massimo ${c.maxLib} Libero.`);
  const seen = {};
  ps.forEach(p => {
    if (!p.n && p.n !== 0) e.push(`Atleta senza numero di maglia: ${p.name || '?'}.`);
    else if (seen[p.n]) e.push(`Numero di maglia ${p.n} ripetuto.`);
    seen[p.n] = 1;
    if (+p.n < 0 || +p.n > 99) e.push(`Numero ${p.n} non valido (0–99).`);
    if (c.mixed && !p.sex) e.push(`N. ${p.n}: indicare il sesso (campionato misto).`);
    const y = yr(p);
    if (p.year && !okDate(p.year)) e.push(`N. ${p.n}: data di nascita incompleta o non valida (usa gg/mm/aaaa).`);
    if (c.minYear && !y) e.push(`N. ${p.n}: indicare la data (o l'anno) di nascita.`);
    if (c.minYear && y && c.fqYear && y < c.fqYear) {
      e.push(`N. ${p.n}: nato nel ${y}, fuori dai limiti d'età (ammessi i nati dal ${c.minYear}; fuoriquota: nati nel ${c.fqYear}).`);
    }
  });
  if (ps.filter(p => p.cap).length > 1) e.push('Indicare un solo capitano.');
  return e;
}

// Composizione in campo: misti e fuoriquota
function compErrors(m, team, court, base) {
  const c = m.cfg, e = [];
  const P_ = n => pl(m, team, n) || {};
  if (c.mixed === '42' || c.mixed === '2F') {
    let women = 0, men = 0;
    for (let i = 0; i < 6; i++) {
      const act = P_(court[i]), nom = P_(base[i]);
      if (act.sex === 'F' && nom.sex === 'F') women++;
      if (act.sex === 'M') men++;
    }
    if (women < 2) e.push('Servono almeno 2 donne in campo (un Libero donna che sostituisce un uomo non conta come donna).');
    if (c.mixed === '42' && men < 1) e.push('Deve esserci almeno 1 uomo in campo.');
  }
  if (c.mixed === '33') {
    let men = 0; for (let i = 0; i < 6; i++) if (P_(court[i]).sex === 'M') men++;
    if (men < 1 || men > 3) e.push(`Uomini in campo: ${men}. Ammessi da 1 a 3.`);
    if ([1, 2, 3].every(i => P_(court[i]).sex === 'M')) e.push('Tre uomini in prima linea (zone II, III, IV): va effettuata una sostituzione, altrimenti la squadra è incompleta e perde il set.');
  }
  if (c.minYear) {
    const fq = court.filter(n => { const p = P_(n); return isFq(m, p) && !(p.lib && c.fqLibExempt); });
    if (fq.length > 1) e.push(`Fuoriquota in campo: ${fq.join(', ')}. Ne è ammesso uno solo alla volta.`);
  }
  return e;
}

// Informazioni accumulate dai set precedenti (squalifiche, gialli, ritardi)
function priorInfo(m, si) {
  const r = { disq: { A: [], B: [] }, yellow: { A: 0, B: 0 }, dwarn: { A: 0, B: 0 } };
  for (let k = 0; k < si; k++) (m.sets[k].ev || []).forEach(ev => {
    if (ev.t !== 'san') return;
    if (ev.k === 'SQ') r.disq[ev.team].push(String(ev.who));
    if (ev.k === 'AV') r.yellow[ev.team]++;
    if (ev.k === 'AR') r.dwarn[ev.team]++;
  });
  return r;
}

function simSet(m, si, upto) {
  const set = m.sets[si], c = m.cfg;
  const pri = priorInfo(m, si);
  const target = setTarget(m, si);
  const st = {
    si, target, tb: isTb(m, si), golden: !!set.golden,
    score: { A: 0, B: 0 }, serve: set.firstServe,
    base: { A: set.lineup.A.map(String), B: set.lineup.B.map(String) },
    court: { A: set.lineup.A.map(String), B: set.lineup.B.map(String) },
    subs: { A: 0, B: 0 }, exc: { A: 0, B: 0 }, tos: { A: 0, B: 0 },
    subLog: { A: [], B: [] }, toLog: { A: [], B: [] }, libLog: { A: [], B: [] }, autoLib: [],
    prog: [], sanc: [], log: [],
    exp: { A: [], B: [] }, disq: pri.disq, yellow: pri.yellow, dwarn: pri.dwarn,
    starters: { A: set.lineup.A.map(String), B: set.lineup.B.map(String) },
    ps: { A: {}, B: {} }, rotN: { A: 0, B: 0 },
    svc: { A: [], B: [] }, curSvc: { team: set.firstServe, box: 0 },
    over: false, winner: null, forced: null, matchForfeit: null, suspended: false,
    startTs: set.start || null, endTs: null,
  };
  const ps = (t, n) => (st.ps[t][n] = st.ps[t][n] || { out: 0, entered: 0, partner: null, back: 0, done: 0, excOut: 0 });
  const evs = set.ev || [];
  const lim = upto == null ? evs.length : Math.min(upto, evs.length);
  const checkOver = () => {
    if (st.over) return;
    for (const t of ['A', 'B']) {
      if (st.score[t] >= target && st.score[t] - st.score[OPP(t)] >= 2) { st.over = true; st.winner = t; }
    }
  };
  const libAuto = (t, ev) => {
    for (const i of [1, 2, 3]) {
      const n = st.court[t][i];
      if (n !== st.base[t][i] && isLib(m, t, n)) {
        st.autoLib.push({ team: t, lib: n, back: st.base[t][i], ev: st._i });
        st.libLog[t].push({ out: n, in: st.base[t][i], a: st.score[t], b: st.score[OPP(t)], auto: 1 });
        st.court[t][i] = st.base[t][i];
      }
    }
  };
  const point = (t, ev, why) => {
    st.score[t]++;
    st.prog.push({ team: t, a: st.score.A, b: st.score.B, why: why || '' });
    if (st.serve !== t) {
      // chiude il turno di servizio dell'avversario
      st.svc[st.serve].push({ box: st.rotN[st.serve] % 6, score: st.score[st.serve] });
      st.serve = t; st.rotN[t]++;
      st.base[t] = rot(st.base[t]); st.court[t] = rot(st.court[t]);
      libAuto(t, ev);
    }
    checkOver();
  };
  for (let i = 0; i < lim && !st.over; i++) {
    const ev = evs[i]; st._i = i;
    const before = { A: st.score.A, B: st.score.B };
    const t = ev.team;
    let txt = '';
    if (ev.t === 'pt') { point(t, ev, ev.why); txt = ev.why === 'FP' ? `Fallo di posizione della squadra ${OPP(t)}: punto e servizio` : 'Punto'; }
    else if (ev.t === 'to') { st.tos[t]++; st.toLog[t].push({ a: st.score[t], b: st.score[OPP(t)] }); txt = `Time-out (${st.tos[t]})`; }
    else if (ev.t === 'sub') {
      const out = String(ev.out), inn = String(ev.in);
      const k = st.base[t].indexOf(out);
      if (k >= 0) { st.base[t][k] = inn; st.court[t][k] = inn; }
      if (ev.exc) { st.exc[t]++; ps(t, out).excOut = 1; ps(t, inn).entered = 1; }
      else {
        st.subs[t]++;
        const po = ps(t, out), pi = ps(t, inn);
        if (st.starters[t].includes(out) && !po.out) { po.out = 1; po.partner = inn; pi.entered = 1; pi.partner = out; }
        else if (po.partner === inn) { pi.back = 1; po.done = 1; }
        else { po.done = 1; pi.entered = 1; pi.partner = out; }
      }
      st.subLog[t].push({ out, in: inn, a: st.score[t], b: st.score[OPP(t)], exc: !!ev.exc, pos: k });
      txt = `${ev.exc ? 'Sostituzione eccezionale' : 'Sostituzione'}: esce ${out}, entra ${inn}`;
    }
    else if (ev.t === 'lib') {
      const out = String(ev.out), inn = String(ev.in);
      const k = st.court[t].indexOf(out);
      if (k >= 0) st.court[t][k] = inn;
      st.libLog[t].push({ out, in: inn, a: st.score[t], b: st.score[OPP(t)] });
      txt = `Libero: esce ${out}, entra ${inn}`;
    }
    else if (ev.t === 'san') {
      st.sanc.push({ team: t, who: String(ev.who), k: ev.k, a: st.score[t], b: st.score[OPP(t)], set: si + 1 });
      if (ev.k === 'AV') st.yellow[t]++;
      if (ev.k === 'AR') st.dwarn[t]++;
      if (ev.k === 'ES') st.exp[t].push(String(ev.who));
      if (ev.k === 'SQ') st.disq[t].push(String(ev.who));
      txt = `${SANC[ev.k].l} a ${whoLabel(m, t, ev.who)}`;
      if (SANC[ev.k].pt) point(OPP(t), ev, ev.k);
    }
    else if (ev.t === 'lose') {
      const o = OPP(t);
      st.score[o] = Math.max(target, st.score[t] + 2, st.score[o]);
      st.over = true; st.winner = o; st.forced = t;
      if (ev.scope === 'match') st.matchForfeit = t;
      txt = ev.scope === 'match' ? 'Perdita della gara' : 'Squadra incompleta: perdita del set';
    }
    else if (ev.t === 'stop') { st.over = true; st.suspended = true; txt = 'Gara sospesa / terminata allo stato attuale' + (ev.why ? ': ' + ev.why : ''); }
    st.log.push({ i, t: ev.t, team: t, txt, before, after: { A: st.score.A, B: st.score.B }, ts: ev.ts });
    if (st.over && !st.endTs) st.endTs = ev.ts || null;
  }
  if (st.over && st.winner && !st.forced && !st.suspended) {
    st.svc[st.serve].push({ box: st.rotN[st.serve] % 6, score: st.score[st.serve], last: 1 });
  }
  st.warn = { A: compErrors(m, 'A', st.court.A, st.base.A), B: compErrors(m, 'B', st.court.B, st.base.B) };
  // giocatori in campo espulsi o squalificati: vanno sostituiti
  ['A', 'B'].forEach(t => st.court[t].forEach(n => {
    if (st.exp[t].includes(n) || st.disq[t].includes(n)) st.warn[t].push(`Il n. ${n} è ${st.disq[t].includes(n) ? 'squalificato' : 'espulso'}: va sostituito.`);
  }));
  return st;
}

function whoLabel(m, t, who) {
  if (who === 'T') return 'squadra';
  if (/^S\d+$/.test(String(who))) { const s = m.teams[t].staff[+String(who).slice(1)]; return s ? `${s.role} ${s.name}` : 'staff'; }
  return 'n. ' + who;
}

function needSets(m) { return Math.floor(m.cfg.sets / 2) + 1; }

function simMatch(m) {
  const c = m.cfg;
  const r = { sets: [], won: { A: 0, B: 0 }, over: false, winner: null, forfeit: null, suspended: false, golden: null };
  m.sets.forEach((s, si) => {
    const st = simSet(m, si); r.sets.push(st);
    if (s.golden) { if (st.over) r.golden = st; return; }
    if (st.over && st.winner) r.won[st.winner]++;
    if (st.matchForfeit) r.forfeit = st.matchForfeit;
    if (st.suspended) r.suspended = true;
  });
  const reg = r.sets.filter(s => !s.golden);
  const last = reg[reg.length - 1];
  if (r.forfeit) {
    const w = OPP(r.forfeit);
    if (c.mode === 'best') r.won[w] = Math.max(r.won[w], needSets(m));
    else r.won[w] += c.sets - reg.length;
    r.over = true; r.winner = w;
  } else if (r.suspended) { r.over = true; }
  else if (c.mode === 'best') {
    ['A', 'B'].forEach(t => { if (r.won[t] >= needSets(m)) { r.over = true; r.winner = t; } });
  } else if (reg.length === c.sets && last && last.over) {
    r.over = true; r.winner = r.won.A === r.won.B ? null : (r.won.A > r.won.B ? 'A' : 'B');
  }
  r.cur = m.sets.length ? r.sets[r.sets.length - 1] : null;
  r.pts = classPts(m, r);
  r.totPts = { A: 0, B: 0 }; r.sets.filter(s => !s.golden).forEach(s => { r.totPts.A += s.score.A; r.totPts.B += s.score.B; });
  return r;
}

// Punti in classifica: 3-0 / 3-1 (o 2-0) → 3-0; vittoria al set decisivo → 2-1
function classPts(m, r) {
  if (!r.over || !r.winner) return null;
  const w = r.winner, l = OPP(w), c = m.cfg;
  if (r.forfeit) return { [w]: 3, [l]: 0 };
  const played = r.won.A + r.won.B;
  const distance = c.mode === 'best' ? played === c.sets : true;
  if (distance && r.won[l] >= 1 && r.won[l] === r.won[w] - 1) return { [w]: 2, [l]: 1 };
  return { [w]: 3, [l]: 0 };
}

// Chi serve e chi sta a sinistra nel set successivo
function nextSetDefaults(m) {
  const n = m.sets.length;
  if (n === 0) return { firstServe: m.toss ? m.toss.firstServe : 'A', left: m.toss ? m.toss.left : 'A', needToss: false };
  const prev = m.sets[n - 1];
  const tb = (m.cfg.mode === 'best' && m.cfg.lastTb && n === m.cfg.sets - 1);
  const noChange = (m.toss && m.toss.noSideChange) || !m.cfg.sideChange;
  let left = noChange ? prev.left : OPP(prev.left);
  if (!noChange && prev.tbSwitch) left = prev.left; // già scambiati a metà del tie-break
  return { firstServe: OPP(prev.firstServe), left, needToss: tb };
}

function leftTeam(m, st) {
  const s = m.sets[st.si];
  const noChange = (m.toss && m.toss.noSideChange) || !m.cfg.sideChange;
  if (st.tb && !noChange && Math.max(st.score.A, st.score.B) >= m.cfg.tbSwitchAt) return OPP(s.left);
  return s.left;
}

// ---- Validazioni azioni live ----
function canSub(m, st, t, out, inn, exc) {
  out = String(out); inn = String(inn);
  const k = st.base[t].indexOf(out);
  if (k < 0) return `Il n. ${out} non è in campo.`;
  if (st.court[t][k] !== out) return `Il n. ${out} è sostituito dal Libero: prima fai uscire il Libero.`;
  const p = pl(m, t, inn);
  if (!p) return `Il n. ${inn} non è a referto.`;
  if (p.lib) return 'Il Libero non può entrare con una sostituzione regolare.';
  if (st.base[t].includes(inn)) return `Il n. ${inn} è già in campo.`;
  if (st.disq[t].includes(inn)) return `Il n. ${inn} è squalificato.`;
  if (st.exp[t].includes(inn)) return `Il n. ${inn} è espulso per questo set.`;
  const pi = st.ps[t][inn] || {}, po = st.ps[t][out] || {};
  if (pi.excOut) return `Il n. ${inn} è uscito per sostituzione eccezionale: non può rientrare.`;
  if (exc) return '';
  if (st.subs[t] >= m.cfg.subs) return `Sostituzioni esaurite (${m.cfg.subs} per set).`;
  const outStarter = st.starters[t].includes(out), inStarter = st.starters[t].includes(inn);
  if (outStarter && po.out) return `Il n. ${out} è già uscito e rientrato in questo set.`;
  if (inStarter) {
    if (pi.back) return `Il n. ${inn} è già rientrato in questo set.`;
    if (pi.partner !== out) return `Il titolare ${inn} può rientrare solo al posto del n. ${pi.partner}, e nella sua posizione.`;
    return '';
  }
  if (pi.entered) return `La riserva ${inn} è già entrata in questo set.`;
  if (!outStarter && po.partner && po.partner !== inn) return `La riserva ${out} può essere sostituita solo dal titolare n. ${po.partner}.`;
  return '';
}

function canLib(m, st, t, out, inn) {
  out = String(out); inn = String(inn);
  if (!m.cfg.libero) return 'Il Libero non è previsto in questa categoria.';
  const k = st.court[t].indexOf(out);
  if (k < 0) return `Il n. ${out} non è in campo.`;
  const outL = isLib(m, t, out), inL = isLib(m, t, inn);
  if (inL && (st.exp[t].includes(inn) || st.disq[t].includes(inn))) return `Il Libero ${inn} non può giocare (espulso o squalificato).`;
  if (!outL && inL) {
    if (st.court[t].some(n => isLib(m, t, n))) return 'C\'è già un Libero in campo: usa il cambio Libero/Libero o fai prima uscire il Libero.';
    if (![0, 4, 5].includes(k)) return 'Il Libero può sostituire solo un giocatore di seconda linea (zone I, V, VI).';
    if (k === 0 && st.serve === t) return 'Il Libero non può andare al servizio.';
    return '';
  }
  if (outL && inL) return out === inn ? 'Scegli l\'altro Libero.' : '';
  if (outL && !inL) return inn === st.base[t][k] ? '' : `Al posto del Libero può rientrare solo il n. ${st.base[t][k]}.`;
  return 'Combinazione non valida.';
}

function lineupErrors(m, t, arr, si) {
  const e = [];
  if (arr.some(x => x === '' || x == null)) { e.push('Completa le 6 posizioni.'); return e; }
  if (new Set(arr).size !== 6) e.push('Ogni giocatore può comparire una sola volta.');
  arr.forEach(n => {
    const p = pl(m, t, n);
    if (!p) e.push(`N. ${n} non a referto.`);
    else if (p.lib) e.push(`Il Libero ${n} non può essere nella formazione iniziale.`);
  });
  const pri = priorInfo(m, si);
  arr.forEach(n => { if (pri.disq[t].includes(String(n))) e.push(`Il n. ${n} è squalificato.`); });
  if (!e.length) e.push(...compErrors(m, t, arr.map(String), arr.map(String)));
  return e;
}

if (typeof module !== 'undefined') module.exports = { PRESETS, SANC, newMatch, simSet, simMatch, canSub, canLib, lineupErrors, rosterErrors, compErrors, nextSetDefaults, leftTeam, classPts, OPP };

<script>
// ================= INTERFACCIA =================

const LS = {

  del(k) { try { localStorage.removeItem(k); } catch (e) { } },
};
let IDX = LS.get('rc_idx', []);

function tName(t) { return (M && M.teams[t].name) || (t === 'A' ? 'Squadra A' : 'Squadra B'); }
function fmtTime(ts) { if (!ts) return ''; const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

function open(id) { const m = LS.get('rc_m_' + id, null); if (!m) { toast('Gara non trovata.'); return; } M = m; VIEW = 'match'; TAB = m.sets.length ? 'gioco' : 'gara'; render(); }
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 3200); }

// ---------- HOME ----------
function vHome() {
  const teams = LS.get('rc_teams', []);
  const cards = IDX.map(e => {
    const st = e.status === 'done' ? '<span class="pill done">Conclusa</span>' : e.status === 'live' ? '<span class="pill live">In corso</span>' : '<span class="pill">Da iniziare</span>';
    return `<button class="mcard" data-a="open" data-id="${e.id}">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">${H(fmtDate(e.date))}${e.num ? ' · Gara ' + H(e.num) : ''}</span>${st}</div>
      <div class="vs"><span><span class="sw A"></span>${H(e.A || 'Squadra A')}</span><b>${e.won ? e.won.A : 0}</b><span><span class="sw B"></span>${H(e.B || 'Squadra B')}</span><b>${e.won ? e.won.B : 0}</b></div>
      <div class="small muted">${H(e.camp || '')}${e.parz && e.parz.length ? ' · ' + e.parz.join(', ') : ''}${e.demo ? ' · <b>esempio</b>' : ''}</div></button>`;
  }).join('');
  return bar('Referto CSEN', 'pallavolo', null, `<button data-a="norme">Norme</button>`) + `<main class="wrap">
    <div class="hero"><div><h1>Referti di gara</h1><p>Compila il referto elettronico delle gare di pallavolo CSEN: elenchi, formazioni, punteggio, cambi, Libero, sanzioni, firme. Il referto finale si stampa o si salva in PDF.</p></div>
    <div class="row"><button class="btn pri" data-a="newMatch">+ Nuova gara</button></div></div>
    ${IDX.length ? `<div class="mlist">${cards}</div>` : `<div class="card"><b>Nessuna gara salvata.</b><p class="muted">Crea la prima gara con “Nuova gara”.</p></div>`}
    <div class="grid2" style="margin-top:20px">
      <div class="card stack"><div><div class="eyebrow">Backup</div><p class="small muted" style="margin:4px 0 0">Le gare restano solo su questo dispositivo. Esporta un backup per conservarle o spostarle su un altro iPhone/iPad.</p></div>
        <div class="row"><button class="btn" data-a="exportAll">Esporta backup</button><button class="btn" data-a="importDlg">Importa backup o gara</button></div></div>
      <div class="card stack"><div><div class="eyebrow">Archivio squadre</div><p class="small muted" style="margin:4px 0 0">${teams.length ? teams.map(t => H(t.name)).join(', ') : 'Vuoto. Dalla scheda Squadre di una gara puoi salvare un elenco atleti per riusarlo.'}</p></div>
        ${teams.length ? `<div class="row"><button class="btn sm" data-a="teamArchive">Gestisci archivio</button></div>` : ''}</div>
    </div>
    <p class="small muted" style="margin-top:22px">Versione ${APP_VER}. ${PWA ? 'App installata: funziona anche senza rete.' : 'Anteprima. Per stampare il PDF del referto e usarla offline, installa la versione per iPhone/iPad (pacchetto GitHub Pages).'}</p>
  </main>`;
}

// ---------- MATCH SHELL ----------
function vMatch() {
  const r = simMatch(M);
  const tabs = [['gara', 'Gara'], ['squadre', 'Squadre'], ['gioco', 'Gioco'], ['referto', 'Referto']];
  const tb = `<nav class="tabs">${tabs.map(([k, l]) => `<button class="${TAB === k ? 'on' : ''}" data-a="tab" data-t="${k}">${l}</button>`).join('')}</nav>`;
  const title = `${H(tName('A'))} – ${H(tName('B'))}`;
  let body = '';
  if (TAB === 'gara') body = vGara();
  else if (TAB === 'squadre') body = vSquadre();
  else if (TAB === 'gioco') body = vGioco(r);
  else body = vReferto(r);
  return bar(title, `${r.won.A}–${r.won.B}`, `<button data-a="home" aria-label="Tutte le gare">‹ Gare</button>`, `<button data-a="norme">Norme</button>`, tb) + `<main class="wrap">${body}</main>`;
}

// ---------- GARA ----------
function presetOptions(sel) {
  const g = {};
  Object.entries(PRESETS).forEach(([k, p]) => { (g[p.grp] = g[p.grp] || []).push(`<option value="${k}" ${k === sel ? 'selected' : ''}>${H(p.label)}</option>`); });
  return Object.entries(g).map(([gr, o]) => `<optgroup label="${H(gr)}">${o.join('')}</optgroup>`).join('');
}
function fld(label, path, val, type, extra, cls) {
  return `<label class="f ${cls || ''}">${label}<input type="${type || 'text'}" data-f="${path}" value="${H(val)}" ${extra || ''}></label>`;
}
function vGara() {
  const i = M.info, c = M.cfg, locked = M.sets.length > 0;
  const num = (l, k, ex) => `<label class="f">${l}<input type="number" inputmode="numeric" data-f="cfg.${k}" data-n="1" value="${H(c[k] == null ? '' : c[k])}" ${locked ? 'disabled' : ''} ${ex || ''}></label>`;
  const ck = (l, k) => `<label class="chk"><input type="checkbox" data-f="cfg.${k}" ${c[k] ? 'checked' : ''} ${locked ? 'disabled' : ''}>${l}</label>`;
  return `<div class="stack">
  <div class="card stack"><div class="eyebrow">Dati gara</div>
    <div class="fgrid">
      ${fld('Campionato', 'info.camp', i.camp, 'text', '', 'w2')}${fld('Gara n.', 'info.num', i.num)}${fld('Data', 'info.date', i.date, 'date')}${fld('Ora', 'info.time', i.time, 'time')}
      ${fld('Palestra', 'info.place', i.place)}${fld('Città', 'info.city', i.city)}${fld('Girone', 'info.girone', i.girone)}${fld('Giornata', 'info.giornata', i.giornata)}
      ${fld('1° arbitro', 'info.ref1', i.ref1)}${fld('2° arbitro', 'info.ref2', i.ref2)}${fld('Segnapunti / refertista', 'info.scorer', i.scorer)}
    </div></div>
  <div class="card stack"><div class="row" style="justify-content:space-between"><div class="eyebrow">Regole applicate</div>${locked ? '<span class="small muted">Bloccate: la gara è iniziata.</span>' : ''}</div>
    <label class="f">Modello di referto<select data-f="cfg.refModel"><option value="fipav17" ${(c.refModel || 'fipav17') === 'fipav17' ? 'selected' : ''}>Referto FIPAV 2017 (A3)</option><option value="csen" ${c.refModel === 'csen' ? 'selected' : ''}>Referto CSEN Roma (A4)</option></select></label>
    <label class="f">Campionato CSEN (preset)<select data-a2="preset" ${locked ? 'disabled' : ''}>${presetOptions(c.preset)}</select></label>
    ${c.note ? `<div class="msg warn">${H(c.note)}</div>` : ''}
    <div class="fgrid">
      <label class="f">Formula<select data-f="cfg.mode" ${locked ? 'disabled' : ''}><option value="best" ${c.mode === 'best' ? 'selected' : ''}>Al meglio dei set</option><option value="fixed" ${c.mode === 'fixed' ? 'selected' : ''}>Set obbligatori</option></select></label>
      ${num('Numero set', 'sets', 'min="1" max="7"')}${num('Punti per set', 'pts')}${num('Punti tie-break', 'tbPts')}
      ${num('Sostituzioni per set', 'subs')}${num('Time-out per set', 'tos')}${num('Durata time-out (s)', 'toSec')}${num('Max atleti a referto', 'maxRoster')}
      ${num('Max Libero', 'maxLib')}${num('Nati dal (limite età)', 'minYear')}${num('Fuoriquota: nati nel', 'fqYear')}${num('Cambio campo tie-break a', 'tbSwitchAt')}
      <label class="f">Misto<select data-f="cfg.mixed" ${locked ? 'disabled' : ''}><option value="">No</option><option value="42" ${c.mixed === '42' ? 'selected' : ''}>4+2</option><option value="33" ${c.mixed === '33' ? 'selected' : ''}>3+3</option><option value="2F" ${c.mixed === '2F' ? 'selected' : ''}>2 donne sempre</option></select></label>
      <label class="f">Altezza rete (m)<input data-f="cfg.rete" value="${H(c.rete)}"></label>
    </div>
    <div class="row">${ck('Ultimo set è tie-break', 'lastTb')}${ck('Libero ammesso', 'libero')}${ck('Cambio campo tra i set', 'sideChange')}${ck('Golden set (spareggio a 15)', 'golden')}${ck('Libero fuoriquota esonerato', 'fqLibExempt')}${ck('Battuta dal basso', 'underServe')}</div>
  </div>
  <div class="row noprint"><button class="btn danger" data-a="delMatch">Elimina gara</button><button class="btn" data-a="exportOne">Esporta questa gara</button></div>
  </div>`;
}

const ROLES = ['Dirigente', 'Allenatore', '2° allenatore', 'Dirigente addetto all\'arbitro', 'Medico', 'Fisioterapista', 'Accompagnatore'];
function vTeam(t) {
  const T = M.teams[t], c = M.cfg, errs = rosterErrors(M, t);
  const ps = T.players.map((p, i) => `<tr>
    <td class="num"><input inputmode="numeric" data-f="teams.${t}.players.${i}.n" value="${H(p.n)}" aria-label="Numero"></td>
    <td class="nmc"><input data-f="teams.${t}.players.${i}.name" value="${H(p.name)}" placeholder="Cognome Nome" aria-label="Cognome e nome"></td>
    <td class="yr"><input inputmode="numeric" maxlength="10" autocomplete="off" data-date="1" class="${p.year && !validDate(p.year) ? 'bad' : ''}" data-f="teams.${t}.players.${i}.year" value="${H(p.year)}" placeholder="gg/mm/aaaa" aria-label="Data di nascita"></td>
    <td class="sx"><span class="seg" role="group" aria-label="Sesso">${['F', 'M'].map(v => `<button type="button" class="${p.sex === v ? 'on ' + v : ''}" data-a="sex" data-t="${t}" data-i="${i}" data-v="${v}" aria-pressed="${p.sex === v}">${v}</button>`).join('')}</span></td>

    <td class="ck"><input type="checkbox" data-f="teams.${t}.players.${i}.lib" ${p.lib ? 'checked' : ''} aria-label="Libero"></td>
    <td class="ck"><input type="checkbox" data-f="teams.${t}.players.${i}.cap" ${p.cap ? 'checked' : ''} aria-label="Capitano"></td>
    <td class="tes"><input data-f="teams.${t}.players.${i}.card" value="${H(p.card)}" placeholder="Tessera CSEN" aria-label="Tessera"></td>
    <td><button class="x" data-a="delP" data-t="${t}" data-i="${i}" aria-label="Rimuovi">×</button></td></tr>`).join('');
  const sf = T.staff.map((s, i) => `<tr><td class="role"><select class="sel" data-f="teams.${t}.staff.${i}.role" aria-label="Ruolo">${ROLES.map(r => `<option ${s.role === r ? 'selected' : ''}>${H(r)}</option>`).join('')}</select></td>
    <td><input data-f="teams.${t}.staff.${i}.name" value="${H(s.name)}" placeholder="Cognome Nome"></td><td><input data-f="teams.${t}.staff.${i}.card" value="${H(s.card)}" placeholder="Tessera"></td>
    <td><button class="x" data-a="delS" data-t="${t}" data-i="${i}" aria-label="Rimuovi">×</button></td></tr>`).join('');
  const nl = T.players.length, nlib = T.players.filter(p => p.lib).length;
  return `<div class="card stack" style="border-top:5px solid var(--t${t})">
    <div class="row" style="justify-content:space-between"><span class="eyebrow"><span class="sw ${t}"></span>${t === 'A' ? 'Squadra A · ospitante' : 'Squadra B · ospite'}</span><span class="small muted">${nl}/${c.maxRoster} atleti · ${nlib} Libero</span></div>
    <label class="f">Nome squadra<input data-f="teams.${t}.name" value="${H(T.name)}" placeholder="Società / squadra"></label>
    <div class="scroll"><table class="t"><thead><tr><th>N°</th><th>Cognome e nome</th><th>Nascita</th><th>Sesso</th><th class="ck" title="Libero">Libero<br><small>L</small></th><th class="ck" title="Capitano">Cap.<br><small>K</small></th><th>N° tessera</th><th></th></tr></thead><tbody>${ps}</tbody></table></div>
    <div class="row"><button class="btn sm" data-a="addP" data-t="${t}">+ Atleta</button><button class="btn sm" data-a="pasteDlg" data-t="${t}">Incolla elenco</button><button class="btn sm" data-a="saveTeam" data-t="${t}">Salva in archivio</button><button class="btn sm" data-a="loadTeam" data-t="${t}">Carica da archivio</button></div>
    ${errs.length ? `<div class="msg bad">${errs.map(H).join('<br>')}</div>` : ''}
    <div class="eyebrow">Staff</div>
    <div class="scroll"><table class="t"><tbody>${sf}</tbody></table></div>
    <div class="row"><button class="btn sm" data-a="addS" data-t="${t}">+ Allenatore / dirigente</button></div>
  </div>`;
}
function sigBox(k, label) {
  const v = M.sig[k];
  return `<button class="sig" data-a="sign" data-k="${k}" data-l="${H(label)}"><span class="small"><b>${H(label)}</b></span>${v ? `<img src="${v}" alt="Firma ${H(label)}">` : '<span class="ph">Tocca per firmare</span>'}</button>`;
}
function vSquadre() {
  return `<div class="stack"><div class="grid2">${vTeam('A')}${vTeam('B')}</div>
  <div class="card stack"><div><div class="eyebrow">Firme prima della gara</div><p class="small muted" style="margin:4px 0 0">Capitano, allenatore e dirigente accompagnatore firmano prima della gara. Le modifiche agli elenchi dopo le firme vengono annotate nelle note di gara.</p></div>
  <div class="sigs">${sigBox('capA_pre', 'Capitano ' + tName('A'))}${sigBox('allA_pre', 'Allenatore ' + tName('A'))}${sigBox('dirA_pre', 'Dirigente accompagnatore ' + tName('A'))}${sigBox('capB_pre', 'Capitano ' + tName('B'))}${sigBox('allB_pre', 'Allenatore ' + tName('B'))}${sigBox('dirB_pre', 'Dirigente accompagnatore ' + tName('B'))}</div></div></div>`;
}

// ---------- GIOCO ----------
function vGioco(r) {
  const errs = [...rosterErrors(M, 'A'), ...rosterErrors(M, 'B')];
  const nA = M.teams.A.players.filter(p => !p.lib).length, nB = M.teams.B.players.filter(p => !p.lib).length;
  if (nA < 6 || nB < 6) return `<div class="card stack"><h2>Prima completa gli elenchi</h2><p class="muted">Ogni squadra deve avere almeno 6 atleti (Libero esclusi) per iniziare. Ora: ${H(tName('A'))} ${nA}, ${H(tName('B'))} ${nB}.</p><div><button class="btn pri" data-a="tab" data-t="squadre">Vai a Squadre</button></div></div>`;
  if (!M.toss) return vToss(errs);
  const cur = r.cur;
  if (cur && !cur.over) return vLive(r, cur);
  if (r.over) return vFinal(r);
  return vLineup(r);
}

function vToss(errs) {
  const d = M.tossDraft || (M.tossDraft = { winner: 'A', firstServe: 'A', left: 'A', noSideChange: false });
  const opt = (k, v) => ['A', 'B'].map(t => `<option value="${t}" ${v === t ? 'selected' : ''}>${H(tName(t))}</option>`).join('');
  return `<div class="card stack" style="max-width:720px">
    <div class="eyebrow">Sorteggio</div><h2>Prima del primo set</h2>
    ${errs.length ? `<div class="msg bad">Controlla gli elenchi:<br>${errs.map(H).join('<br>')}</div>` : ''}
    <div class="fgrid">
      <label class="f">Vince il sorteggio<select data-f="tossDraft.winner">${opt('w', d.winner)}</select></label>
      <label class="f">Al servizio nel 1° set<select data-f="tossDraft.firstServe">${opt('s', d.firstServe)}</select></label>
      <label class="f">Campo a sinistra del segnapunti<select data-f="tossDraft.left">${opt('l', d.left)}</select></label>
    </div>
    <label class="chk"><input type="checkbox" data-f="tossDraft.noSideChange" ${d.noSideChange ? 'checked' : ''}>I due capitani chiedono di non cambiare campo tra i set (CSEN Roma art. 10)</label>
    <div class="row"><button class="btn pri" data-a="tossOk">Conferma sorteggio</button></div></div>`;
}

// giocatori disponibili per la formazione (esclusi Libero, squalificati e chi è già in un'altra zona)
function lineupPool(t, si, exceptK) {
  const pri = priorInfo(M, si), d = M.draft;
  const used = d[t].filter((n, k) => k !== exceptK && n !== '' && n != null).map(String);
  return M.teams[t].players.filter(p => !p.lib && !pri.disq[t].includes(String(p.n)) && !used.includes(String(p.n))).sort((a, b) => a.n - b.n);
}
// campo 18×9 m visto dal tavolo del segnapunti: per ogni fila, seconda e prima linea della squadra a sinistra, poi prima e seconda linea di quella a destra
function pitchHTML(L, R, cell, capL, capR) {
  const colsL = [[4, 5, 0], [3, 2, 1]], colsR = [[1, 2, 3], [0, 5, 4]];
  let cells = '';
  for (let row = 0; row < 3; row++) cells += cell(L, colsL[0][row], 'L') + cell(L, colsL[1][row], 'L') + cell(R, colsR[0][row], 'R') + cell(R, colsR[1][row], 'R');
  return `<div class="vcourt"><span class="tlab L" style="--c:var(--t${L})"><i></i>${H(tName(L))}</span><span class="tlab R" style="--c:var(--t${R})"><i></i>${H(tName(R))}</span>
    <div class="pitch"><div class="cl"></div><div class="al l"></div><div class="al r"></div><div class="net"></div><span class="ant t"></span><span class="ant b"></span><div class="zones">${cells}</div></div>
    ${capL ? `<span class="side L">${capL}</span>` : ''}${capR ? `<span class="side R">${capR}</span>` : ''}</div>`;
}
function tokenHTML(t, n, p, o) {
  if (!p) return `<span class="tok empty">+</span>`;
  return `<span class="tok ${o.lib ? 'lib' : ''}" style="--c:var(--${o.lib ? 'lib' : 't' + t})">${H(n)}${p.cap ? '<span class="k">K</span>' : ''}${o.serve ? '<span class="ball" title="Al servizio"></span>' : ''}${o.fq ? '<span class="fq">FQ</span>' : ''}</span>`;
}
function zoneHTML(t, k, d, side) {
  const n = d[t][k], p = n !== '' && n != null ? pl(M, t, n) : null;
  const sx = p && M.cfg.mixed && p.sex ? ` · ${p.sex}` : '';
  return `<button type="button" class="zc s${side}" data-a="zone" data-t="${t}" data-k="${k}" aria-label="${H(tName(t))}, zona ${POS[k]}${p ? ', numero ' + H(n) : ', vuota'}">
    <span class="zl">${POS[k]}</span>${tokenHTML(t, n, p, { serve: k === 0 && d.firstServe === t, fq: p && isFq(M, p) })}${p ? `<span class="tn">${H((p.name || '').split(' ')[0])}${sx}</span>` : ''}</button>`;
}
function vLineup(r) {
  const si = M.sets.length;
  const def = nextSetDefaults(M);
  if (!M.draft || M.draft.si !== si) {
    const prev = M.sets[si - 1];
    M.draft = { si, A: ['', '', '', '', '', ''], B: ['', '', '', '', '', ''], firstServe: def.firstServe, left: def.left, golden: false };
    if (prev) { M.draft.A = prev.lineup.A.slice(); M.draft.B = prev.lineup.B.slice(); }
  }
  const d = M.draft, tb = def.needToss;
  const L = d.left, R = OPP(L);
  const opt = v => ['A', 'B'].map(t => `<option value="${t}" ${v === t ? 'selected' : ''}>${H(tName(t))}</option>`).join('');
  const last = r.cur;
  const head = last && last.over ? `<div class="card row" style="justify-content:space-between"><div><div class="eyebrow">Set ${si} concluso</div><div class="big" style="font-family:var(--fd);font-size:28px;font-weight:800">${H(tName('A'))} ${last.score.A} – ${last.score.B} ${H(tName('B'))}</div><div class="small muted">Set: ${r.won.A}–${r.won.B}</div></div><button class="btn" data-a="undo">↶ Annulla ultimo punto</button></div>` : '';
  const bench = t => {
    const e = lineupErrors(M, t, d[t], si), pool = lineupPool(t, si, -1), full = d[t].every(x => x !== '' && x != null);
    const libs = M.teams[t].players.filter(p => p.lib);
    return `<div class="card stack" style="border-top:5px solid var(--t${t})">
      <div class="row" style="justify-content:space-between"><b>${H(tName(t))}</b><span class="row"><button class="btn sm" data-a="rotDraft" data-t="${t}" title="Ruota la formazione di una posizione">Ruota ↻</button>${si > 0 ? `<button class="btn sm" data-a="prevDraft" data-t="${t}">Come set ${si}</button>` : ''}<button class="btn sm" data-a="clearDraft" data-t="${t}">Svuota</button></span></div>
      <div><div class="eyebrow">Panchina${full ? '' : ' · tocca un giocatore per metterlo nella prima zona libera (I → VI)'}</div>
      <div class="chips">${pool.map(p => `<button type="button" class="chip ${t}" data-a="benchPick" data-t="${t}" data-n="${H(p.n)}" ${full ? 'disabled' : ''}><b>${H(p.n)}</b><span>${H((p.name || '').split(' ')[0])}${M.cfg.mixed && p.sex ? ' · ' + p.sex : ''}</span></button>`).join('') || '<span class="small muted">Tutti in campo.</span>'}
      ${libs.map(p => `<span class="chip lib" title="Il Libero non entra nella formazione iniziale"><b>${H(p.n)}</b><span>Libero</span></span>`).join('')}</div></div>
      ${e.length ? `<div class="msg ${e[0] === 'Completa le 6 posizioni.' ? 'warn' : 'bad'}">${e.map(H).join('<br>')}</div>` : '<div class="msg ok">Formazione regolare.</div>'}</div>`;
  };
  return `<div class="stack">${head}
    <div class="card stack"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">${tb ? 'Tie-break · nuovo sorteggio' : 'Formazioni'}</div><h2>Set ${si + 1}${tb ? ' (tie-break a ' + M.cfg.tbPts + ')' : ' a ' + M.cfg.pts}</h2></div>
      <div class="fgrid lsel"><label class="f">Al servizio<select data-f="draft.firstServe">${opt(d.firstServe)}</select></label><label class="f">A sinistra del segnapunti<select data-f="draft.left">${opt(d.left)}</select></label></div></div>
      ${pitchHTML(L, R, (t, k, side) => zoneHTML(t, k, d, side), d.firstServe === L ? 'Al servizio' : 'In ricezione', d.firstServe === R ? 'Al servizio' : 'In ricezione')}
      <p class="small muted" style="margin:0">Campo visto dal tavolo del segnapunti. Tra la rete e la linea dei 3 metri c’è la prima linea (II, III, IV); la zona I è il battitore. Tocca una zona per scegliere o cambiare il giocatore.</p></div>
    <div class="grid2">${bench(L)}${bench(R)}</div>
    <div class="row"><button class="btn pri" data-a="startSet">Inizia set ${si + 1}</button>${si === 0 ? `<button class="btn" data-a="redoToss">Rifai sorteggio</button>` : ''}</div></div>`;
}

function slotHTML(t, i, st, side) {
  const n = st.court[t][i], p = pl(M, t, n) || {}, lib = isLib(M, t, n);
  const sx = M.cfg.mixed && p.sex ? ` · ${p.sex}` : '';
  return `<button type="button" class="zc s${side}" data-a="slot" data-t="${t}" data-n="${H(n)}" aria-label="${lib ? 'Libero ' : ''}numero ${H(n)} in zona ${POS[i]}">
    <span class="zl">${POS[i]}</span>${tokenHTML(t, n, p, { lib, serve: st.serve === t && i === 0, fq: isFq(M, p) })}<span class="tn">${lib ? 'Libero' : H((p.name || '').split(' ')[0])}${sx}</span></button>`;
}
// giocatori per cui il Libero entra di solito: scelti dall'utente + già sostituiti dal Libero nella gara
function libCandidates(t, st) {
  const cand = new Set(((M.libFor || {})[t] || []).map(String));
  for (let k = 0; k <= st.si && k < M.sets.length; k++) {
    const ss = k === st.si ? st : simSet(M, k);
    ss.libLog[t].forEach(x => { if (!x.auto && !isLib(M, t, x.out)) cand.add(String(x.out)); });
  }
  return cand;
}
function libHints(st) {
  const out = [];
  if (!M.cfg.libero) return out;
  const evs = M.sets[st.si].ev, lastLib = evs.length && evs[evs.length - 1].t === 'lib';
  ['A', 'B'].forEach(t => {
    const libs = M.teams[t].players.filter(p => p.lib && !st.exp[t].includes(String(p.n)) && !st.disq[t].includes(String(p.n))).map(p => String(p.n));
    if (!libs.length || st.court[t].some(n => isLib(M, t, n))) return;
    const cand = libCandidates(t, st);
    if (!cand.size) return;
    [4, 5, 0].forEach(k => {
      const n = st.court[t][k]; if (!cand.has(n)) return;
      const L = libs.find(l => !canLib(M, st, t, n, l) && !compErrors(M, t, Object.assign(st.court[t].slice(), { [k]: l }), st.base[t]).length);
      if (L) out.push({ t, k, n, lib: L, wait: lastLib });
    });
  });
  return out;
}
function vLive(r, st) {
  const L = leftTeam(M, st), R = OPP(L), c = M.cfg;
  const dots = (used, max) => `<span class="dots">${Array.from({ length: max }, (_, k) => `<i class="${k < used ? 'u' : ''}"></i>`).join('')}</span>`;
  const tbBlock = (t, side) => `<div class="tb ${side}" style="--c:var(--t${t})">
      ${side === 'R' ? `<div class="sc">${st.score[t]}</div>` : ''}
      <div class="nm">${st.serve === t && side === 'R' ? '<span class="ball"></span> ' : ''}${H(tName(t))}${st.serve === t && side === 'L' ? ' <span class="ball"></span>' : ''}</div>
      ${side === 'L' ? `<div class="sc">${st.score[t]}</div>` : ''}
      <div class="meta"><span>TO ${dots(st.tos[t], c.tos)}</span><span>Cambi ${st.subs[t]}/${c.subs}</span></div></div>`;
  const cons = t => `<div class="cons" style="--c:var(--t${t})">
      <button class="pt" data-a="pt" data-t="${t}">PUNTO<small>${H(tName(t))}</small></button>
      <div class="act"><button class="btn" data-a="to" data-t="${t}" ${st.tos[t] >= c.tos ? 'disabled' : ''}>Time-out</button><button class="btn" data-a="subDlg" data-t="${t}">Cambio</button>
      ${c.libero ? `<button class="btn" data-a="libDlg" data-t="${t}">Libero</button>` : ''}<button class="btn" data-a="sanDlg" data-t="${t}">Sanzione</button></div></div>`;
  const fpBtn = t => M.cfg.mixed ? ` <button class="btn sm" data-a="fallo" data-t="${t}">Fallo di posizione: punto a ${H(tName(OPP(t)))}</button>` : '';
  const warns = [...st.warn[L].map(w => `<div class="msg bad"><b>${H(tName(L))}:</b> ${H(w)}${/donne|uomini|uomo|prima linea/i.test(w) ? fpBtn(L) : ''}</div>`), ...st.warn[R].map(w => `<div class="msg bad"><b>${H(tName(R))}:</b> ${H(w)}${/donne|uomini|uomo|prima linea/i.test(w) ? fpBtn(R) : ''}</div>`)];
  const tbNote = st.tb && Math.max(st.score.A, st.score.B) === c.tbSwitchAt && !(M.toss.noSideChange || !c.sideChange) ? `<div class="msg warn">Tie-break: a ${c.tbSwitchAt} punti le squadre cambiano campo (già invertite sullo schermo).</div>` : '';
  const done = r.sets.filter(s => s.over && !s.golden).map(s => `<span>${s.score[L]}-${s.score[R]}</span>`).join('');
  const log = st.log.slice().reverse().slice(0, 30).map(l => `<div><span class="s">${l.after[L]}-${l.after[R]}</span><span><span class="sw ${l.team || ''}"></span>${l.t === 'pt' && !/Fallo/.test(l.txt) ? 'Punto ' + H(tName(l.team)) : H(l.txt)}${l.t !== 'pt' && l.team ? ' · ' + H(tName(l.team)) : ''}</span></div>`).join('');
  const hints = libHints(st);
  const auto = st.autoLib.filter(a => a.ev === (M.sets[st.si].ev.length - 1)).map(a => `<div class="msg warn">Il Libero ${H(a.lib)} (${H(tName(a.team))}) è arrivato in zona IV: rientrato in automatico il n. ${H(a.back)}.</div>`).join('');
  return `<div class="live">
    <div class="board">${tbBlock(L, 'L')}<div class="mid"><span class="sn">${st.golden ? 'Golden set' : st.tb ? 'Tie-break' : 'Set ' + (st.si + 1)}</span><span class="sw2">${r.won[L]} – ${r.won[R]}</span><span class="sn">a ${st.target}</span></div>${tbBlock(R, 'R')}</div>
    <div class="arena">${cons(L)}${pitchHTML(L, R, (t, k, side) => slotHTML(t, k, st, side), st.serve === L ? 'Al servizio' : 'In ricezione', st.serve === R ? 'Al servizio' : 'In ricezione')}${cons(R)}</div>
    ${warns.length || tbNote || auto || hints.length ? `<div class="warnbar">${warns.join('')}${tbNote}${auto}${hints.map(h => `<div class="msg hint"><span><b>Libero ${H(tName(h.t))}:</b> ${h.wait ? `dopo la prossima azione può entrare il n. ${H(h.lib)} al posto del n. ${H(h.n)} (zona ${POS[h.k]})` : `può entrare il n. ${H(h.lib)} al posto del n. ${H(h.n)} (zona ${POS[h.k]})`}</span>${h.wait ? '' : `<button class="btn sm" data-a="libGo" data-t="${h.t}" data-out="${H(h.n)}" data-in="${H(h.lib)}">Fai entrare il Libero</button>`}</div>`).join('')}</div>` : ''}
    <div class="logbar"><div class="stack" style="gap:8px"><button class="btn" data-a="undo">↶ Annulla</button><button class="btn sm" data-a="moreDlg">Altro…</button></div>
      <div class="log" aria-live="polite">${log || '<div class="muted">Il set è iniziato alle ' + fmtTime(st.startTs) + '. Tocca PUNTO per la squadra che vince lo scambio.</div>'}</div>
      <div class="stack" style="gap:6px;align-items:flex-end"><span class="eyebrow">Set giocati</span><div class="setlist">${done || '<span>—</span>'}</div></div></div>
  </div>`;
}

function vFinal(r) {
  const w = r.winner;
  const parz = r.sets.filter(s => !s.golden).map(s => `<span>${s.score.A}-${s.score.B}</span>`).join('');
  const notes = autoNotes(r);
  return `<div class="stack">
    <div class="card stack"><div class="row" style="justify-content:space-between"><div class="eyebrow">${r.suspended ? 'Gara terminata allo stato attuale' : 'Gara conclusa'}</div><button class="btn sm" data-a="undo">↶ Annulla ultima azione</button></div>
      <div style="font-family:var(--fd);font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.05"><span class="tA">${H(tName('A'))}</span> ${r.won.A} – ${r.won.B} <span class="tB">${H(tName('B'))}</span></div>
      <div class="setlist">${parz}</div>
      ${r.pts ? `<div class="small">Punti in classifica: <b>${H(tName('A'))} ${r.pts.A}</b>, <b>${H(tName('B'))} ${r.pts.B}</b>${w ? ` · vince ${H(tName(w))}` : ''}</div>` : ''}
      ${r.golden ? `<div class="small">Golden set: ${r.golden.score.A}-${r.golden.score.B}</div>` : ''}
      ${M.cfg.golden && !r.golden ? `<div><button class="btn sm" data-a="golden">Gioca il Golden set (a ${M.cfg.goldenPts})</button></div>` : ''}
    </div>
    ${notes.length ? `<div class="card stack"><div class="eyebrow">Note di gara (automatiche)</div><div class="small">${notes.map(H).join('<br>')}</div></div>` : ''}

function autoNotes(r) {

  r.sets.forEach(st => {
    ['A', 'B'].forEach(t => st.subLog[t].filter(s => s.exc).forEach(s => n.push(`Set ${st.si + 1}: sostituzione eccezionale ${tName(t)}, esce ${s.out} entra ${s.in} sul ${s.a}-${s.b}.`)));
    st.sanc.filter(s => s.k === 'ES' || s.k === 'SQ').forEach(s => n.push(`Set ${s.set}: ${SANC[s.k].l} ${whoLabel(M, s.team, s.who)} (${tName(s.team)}) sul ${s.a}-${s.b}.`));
    st.log.filter(l => /Fallo di posizione/.test(l.txt)).forEach(l => n.push(`Set ${st.si + 1}: fallo di posizione di ${tName(OPP(l.team))} sul ${l.before.A}-${l.before.B} (punto a ${tName(l.team)}).`));
    if (st.forced && !st.matchForfeit) n.push(`Set ${st.si + 1}: ${tName(st.forced)} dichiarata incompleta, perde il set.`);

function secData(m, st, t, from) {

    <li><b>Art. 12</b> La squadra di casa fornisce un refertista idoneo: altrimenti 10 €, poi 20 €.</li>
    <li><b>Art. 13</b> Istanza sul risultato: preannunciata dal capitano in gara, confermata sul referto, scritta entro 24 ore, tassa 30 €.</li></ul></div>
  <div class="card stack"><h2>Novità regolamentari 2026/27</h2><ul>
    <li><b>Sostituzioni:</b> massimo 8. Il titolare esce e rientra una volta per set, nella sua posizione; la riserva entra una volta e può essere sostituita solo dallo stesso titolare. (L'app le conta per set.)</li>
    <li><b>Posizioni al servizio:</b> solo la squadra in ricezione deve rispettare le posizioni fino al primo movimento del battitore; la squadra al servizio è libera.</li>
    <li><b>Velo:</b> chi è al servizio non può alzare le mani sopra la testa finché la palla non supera la rete.</li>
    <li><b>Soffitto e strutture:</b> palla che li tocca dopo il 1° o 2° tocco ed è ancora giocabile dalla stessa squadra: si continua.</li>
    <li><b>Doppia in palleggio:</b> fallo solo se il palleggio di 1° o 2° tocco va volontariamente nel campo avversario.</li>
    <li><b>Protocollo:</b> riscaldamento ufficiale condiviso di 10 minuti.</li>
    <li><b>Attacco spinto, trattenuto o lanciato:</b> maggiore attenzione arbitrale nel sanzionarlo.</li>
    <li><b>Nota:</b> l'art. 7 del regolamento indica ancora 6 cambi a set; prevale il comunicato più recente (08/11/2026) con 8 sostituzioni, che l'app conta per set.</li></ul>
    <h2>Misti CSEN Roma</h2><ul>
    <li><b>4+2</b> (rete 2,35): da 1 a 4 uomini. Libero solo con almeno 2 donne in campo e nel sestetto; con 2 sole donne, una donna può essere sostituita solo da un Libero donna; un Libero donna al posto di un uomo non conta come donna. Violazione = fallo di posizione: punto e servizio agli avversari; i punti già fatti restano validi tranne l'ultimo.</li>
    <li><b>3+3</b> (rete 2,35): da 1 a 3 uomini, mai 3 uomini in prima linea (zone II, III, IV). Il Libero di qualsiasi sesso può sostituire uomini o donne, sempre con 1–3 uomini in campo. Violazione = fallo di posizione; se la formazione non si può correggere la squadra è incompleta e perde il set.</li></ul></div>
  <div class="card stack"><h2>Giovanili CSEN Roma 2026/27</h2><ul>
    <li>3 set obbligatori a 25, rally point. Classifica 3-0 → 3 punti, 2-1 → 2 e 1.</li>
    <li>Fuoriquota (nati nell'anno indicato) illimitati in lista, uno solo in campo alla volta. Il Libero fuoriquota (U14 e oltre) non conta in questo limite. Nessuna eccezione per i nati prima.</li>
    <li>U12 e U13: niente Libero, battuta dal basso, pallone Volley Scuola.</li>
    <li>U17 e U19 maschili: primo tocco in ricezione con le sole tecniche ammesse.</li>
    <li>U12–U15: l'arbitro lo fornisce la squadra di casa, che entro il giorno dopo invia risultato, parziali e foto di referto e liste a risultati@csenromapallavolo.it.</li></ul></div>
  <div class="card stack"><h2>CSEN in Volley Nazionale 2025/26</h2><p class="small muted" style="margin:0">Il regolamento nazionale 2026/27 non risulta ancora pubblicato.</p><ul>

    <li>Massimo 14 atleti a referto con due Libero; minimo 8 atleti (giovanili) o 9 (open) presenti. Sostituzioni secondo FIPAV.</li>
    <li>Ritardo 11′–29′: 20 €. Oltre 30′ o non tesserato: gara persa 2-0 e 20 €. Reclami scritti entro 10′ dalla fine, tassa 50 €.</li>
    <li>Open misto: almeno 2 donne sempre in campo e schierate nella formazione iniziale; doppio Libero ammesso.</li></ul>

  sign(d) {
    modal(`<h2>Firma · ${H(d.l)}</h2><canvas class="sigpad" id="pad"></canvas><div class="foot"><button class="btn" id="sc">Cancella</button>${M.sig[d.k] ? '<button class="btn danger" id="sd">Rimuovi firma</button>' : ''}<button class="btn" data-a="close">Annulla</button><button class="btn pri" id="sk">Salva firma</button></div>`, el => {
      const cv = el.querySelector('#pad'), r = cv.getBoundingClientRect(); const k = 2;
      cv.width = r.width * k; cv.height = r.height * k; const g = cv.getContext('2d');
      g.lineWidth = 2.4 * k; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0b1b3a';
      let drawing = false, any = false, last = null;
      const P_ = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * k, (e.clientY - b.top) * k]; };
      cv.addEventListener('pointerdown', e => { drawing = true; last = P_(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
      cv.addEventListener('pointermove', e => { if (!drawing) return; const p = P_(e); g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke(); last = p; any = true; e.preventDefault(); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => drawing = false));
      el.querySelector('#sc').onclick = () => { g.clearRect(0, 0, cv.width, cv.height); any = false; };

function maskDate(v) {
  const d = String(v).replace(/\D/g, '').slice(0, 8);
  if (d.length <= 2) return d;
  if (d.length <= 4) return d.slice(0, 2) + '/' + d.slice(2);
  return d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4);
}
function normDate(v) {
  v = String(v || '').trim();
  const m = v.match(/^(\d{1,2})[\/.\- ](\d{1,2})[\/.\- ](\d{2,4})$/);
  if (m) { let y = m[3]; if (y.length === 2) y = (+y > 30 ? '19' : '20') + y; return m[1].padStart(2, '0') + '/' + m[2].padStart(2, '0') + '/' + y; }

  return v;
}
function validDate(v) {
  v = String(v || '');
  if (/^\d{4}$/.test(v)) return true;
  const m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (!m) return false;
  const d = +m[1], mo = +m[2], y = +m[3], dt = new Date(y, mo - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d && y > 1900 && y <= new Date().getFullYear();
}

    el.classList.toggle('bad', e.type === 'change' && f !== '' && !validDate(f));

  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.n) v = v === '' ? null : +v;
  setPath(M, p, v);

  m.teams.A = { name: 'Esempio Volley', players: mk(1, 9), staff: [{ role: 'Allenatore', name: 'Allenatore Esempio', card: '' }] };
  m.teams.B = { name: 'Squadra Demo', players: mk(11, 9).map((p, i) => Object.assign(p, { name: names[(i + 4) % 10] })), staff: [{ role: 'Allenatore', name: 'Coach Demo', card: '' }] };
  m.toss = { winner: 'A', firstServe: 'A', left: 'A', noSideChange: false, ts: Date.now() - 3600e3 };
  const t0 = Date.now() - 50 * 60e3;
  m.sets.push({ lineup: { A: ['1', '2', '3', '4', '5', '6'], B: ['11', '12', '13', '14', '15', '16'] }, firstServe: 'A', left: 'A', start: t0, ev: [] });
  const seq = 'ABAABBABAAABBABAABABBAAABAABBAAABABAA'; let ts = t0;
  for (const ch of seq) { ts += 40e3; m.sets[0].ev.push({ t: 'pt', team: ch, ts }); if (m.sets[0].ev.length === 14) m.sets[0].ev.push({ t: 'to', team: 'B', ts }); if (m.sets[0].ev.length === 20) m.sets[0].ev.push({ t: 'sub', team: 'B', out: '13', in: '17', ts }); }
  while (!simSet(m, 0).over) { ts += 40e3; m.sets[0].ev.push({ t: 'pt', team: 'A', ts }); }
  m.sets.push({ lineup: { A: ['1', '2', '3', '4', '5', '6'], B: ['11', '12', '13', '14', '15', '16'] }, firstServe: 'B', left: 'B', start: ts + 180e3, ev: [] });
  ts += 180e3; const s2 = 'BBABAABBBABABAAB';
  for (const ch of s2) { ts += 40e3; m.sets[1].ev.push({ t: 'pt', team: ch, ts }); if (m.sets[1].ev.length === 6) { const st = simSet(m, 1); const o = st.court.A[5]; if (!canLib(m, st, 'A', o, '10')) m.sets[1].ev.push({ t: 'lib', team: 'A', out: o, in: '10', ts }); } }
  M = m; save(); M = null;
}
